<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>RepArchive</title><link rel="icon" href="页面资源/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="页面资源/viewer.css"></head>
<body><div id="app"><aside id="sidebar"><header class="brand"><img class="brand-icon" src="页面资源/logo.svg" alt=""><b>RepArchive</b></header><div class="side-head"><h1 id="side-title">CHATS</h1><button id="about" class="icon" aria-label="アーカイブ情報">ⓘ</button></div><div class="fandom-tab">Fandom Chat</div><label class="search"><span>⌕</span><input id="room-search" type="search" placeholder="推しを検索" aria-label="推しを検索"></label><div id="room-list"></div><nav id="navigation" aria-label="ページ"><button data-view="chats" class="active"><span>♧</span>CHATS</button><button data-view="answers"><span>▷</span>リプライ</button><button data-view="people"><span>♡</span>推し</button><button data-view="saved"><span>☆</span>保存</button></nav></aside><main id="main"></main></div>
