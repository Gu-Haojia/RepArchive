syntax = "proto3";
package model;
import "http.proto";
// Field tags retained from nsy_chat_live@69c6d519.
message GetUserPrivateRequest {}
message GetUserPrivateResponse { UserPrivate user = 1; }
message ListMyOshisRequest { int64 max_page_size = 1; string page_token = 2; }
message ListMyOshisResponse { repeated ListMyOshisOshi oshis = 1; string next_page_token = 2; int64 my_oshis_count = 3; }
message ListMyOshisOshi { string oshi_id = 1; string name = 2; string profile_image_url = 4; OshiUser user = 5; string membership_image_url = 7; }
message OshiUser { string user_id = 1; string unique_id = 2; string display_name = 3; string profile_image_url = 4; string profile_background_image_url = 13; string sm_profile_image_url = 18; }
enum FollowTargetType { FOLLOW_TARGET_TYPE_UNSPECIFIED = 0; FOLLOW_TARGET_TYPE_USER = 1; FOLLOW_TARGET_TYPE_OSHI = 2; }
message ListFollowingsRequest { string user_id = 1; string prefix = 2; int64 max_page_size = 3; string page_token = 4; FollowTargetType type = 5; }
message ListFollowingsResponse { repeated FollowTarget follow_targets = 1; string next_page_token = 2; }
message FollowTarget { FollowTargetType type = 1; OshiUser user = 2; ListMyOshisOshi oshi = 3; }
