<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepArchive · 控制台</title><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/control.css"></head><body>
<div class="shell"><aside><a class="brand" href="/"><img src="/logo.svg" alt=""><b>RepArchive</b></a><div class="subtitle">控制台</div><nav><button data-tab="export" class="active">↗ <span>导出任务</span></button><button data-tab="library">▤ <span>备份库</span></button><button data-tab="account">◎ <span>账号与设置</span></button></nav></aside>
<main><header><div><h1 id="page-title">导出任务</h1><p id="page-description">选择保存位置，导出资源并生成浏览页面。</p></div><span id="session-badge" class="badge">读取状态…</span></header><div id="toast" role="alert" hidden></div>
<article id="current-task" class="panel current-task" hidden aria-label="当前任务" aria-live="polite"><div class="task-heading"><div><h2>当前任务 <span id="job-kind"></span></h2><p id="job-detail"></p></div><span id="job-state" class="badge"></span><button id="cancel" class="secondary">停止任务</button></div><progress id="progress" max="100" value="0"></progress><div class="task-meta"><span id="job-count"></span><span id="job-path"></span><time id="job-time"></time></div></article>
<section id="tab-export" class="tab active"><article class="panel"><div class="panel-title"><h2>导出资源</h2></div><p class="muted">已有目录会更新新增内容，复用已下载的资源。</p><form id="export-form"><label for="output">保存位置</label><div class="path-row"><input id="output" required spellcheck="false" placeholder="备份文件夹的完整路径"><button type="button" class="secondary" id="browse">选择</button></div><button id="start-export" class="primary" type="submit">开始导出 <span>→</span></button></form><div class="scope"><b>导出内容</b><span>订阅与人物资料</span><span>聊天文字、图片、短视频</span><span>提问卡片、回答视频及字幕</span></div></article><article class="panel history"><div class="panel-title"><h2>最近任务</h2><button id="clear-history" class="secondary" type="button" disabled>清除</button></div><div id="history"></div></article></section>
<section id="tab-library" class="tab"><div class="section-head"><p class="muted">打开备份，更新资源，重新生成页面或校验文件。</p><button id="import" class="secondary">添加已有备份</button></div><div id="libraries" class="library-grid"></div></section>
<section id="tab-account" class="tab"><div class="two-col"><article class="panel"><div class="panel-title"><h2>登录账号</h2></div><p class="muted" id="auth-detail"></p><div class="login-methods"><button data-provider="google" class="secondary">Google 登录</button><button data-provider="twitter" class="secondary">X / Twitter 登录</button></div>
<div id="sns-login" hidden><h3 id="sns-title"></h3><p id="sns-instructions" class="muted">在系统浏览器完成登录。</p><div class="actions"><button id="sns-system-open" class="primary" type="button">用系统浏览器打开 ↗</button><a id="sns-open" class="text-button" target="_blank" rel="noopener noreferrer">登录页面链接</a><button id="sns-cancel" class="text-button" type="button">取消</button></div><details><summary>手动完成回调</summary><form id="sns-form"><label for="sns-callback">登录回调地址</label><textarea id="sns-callback" rows="3" autocomplete="off" spellcheck="false" required placeholder="com.googleusercontent.apps.…:/oauth2callback?… 或 replive-user-auth://user-auth?…"></textarea><div class="actions"><button class="primary" type="submit">完成登录</button></div></form></details></div>
<hr><h3>手机号登录</h3><form id="sms-form"><div class="phone-row"><div><label for="country">国际区号</label><input id="country" value="81" inputmode="numeric" required></div><div><label for="phone">手机号</label><input id="phone" type="tel" autocomplete="tel-national" required></div></div><p class="hint">日本 81，中国 86。</p><button class="secondary" type="submit">发送短信验证码</button></form><form id="login-form"><label for="code">短信验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,8}" required><button class="primary" type="submit">登录</button></form></article>
<article class="panel"><div class="panel-title"><h2>会话与设置</h2></div><div class="actions"><button data-auth="check" class="secondary">验证会话</button><button data-auth="preflight" class="secondary">检查短信接口</button><button data-auth="forget" class="danger">退出登录</button></div><details><summary>导入 refresh_token / 原项目配置</summary><form id="token-form"><textarea id="token" rows="4" autocomplete="off" spellcheck="false" required aria-label="refresh_token 或配置内容"></textarea><button class="secondary" type="submit">导入并验证</button></form></details><hr><h3>默认保存位置</h3><form id="settings-form"><input id="default-output" required aria-label="默认保存位置"><button class="secondary" type="submit">保存设置</button></form><hr><h3>本地服务</h3><button id="shutdown" class="danger">关闭服务</button></article></div></section>
</main></div>
<dialog id="folder-dialog"><div class="panel-title"><h2>选择父文件夹</h2><button id="folder-close" class="text-button">关闭</button></div><form id="folder-path-form"><div class="path-row"><input id="folder-path" aria-label="文件夹路径"><button class="secondary">转到</button></div></form><div id="folder-list"></div><label for="folder-name">备份文件夹名称</label><input id="folder-name" value="reparchive-backup"><div class="actions"><button id="folder-up" class="secondary">上一级</button><button id="folder-select" class="primary">使用此位置</button></div><p class="hint">使用已有目录时，留空文件夹名称。</p></dialog>
<script src="/control.js"></script></body></html>
